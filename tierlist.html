<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP Leaderboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #05070c;
            --panel: rgba(255, 255, 255, 0.04);
            --panel2: rgba(255, 255, 255, 0.06);
            --text: #e6edf3;
            --muted: #9ca3af;
        }

        body {
            margin: 0;
            font-family: 'Poppins', system-ui;
            background: radial-gradient(circle at top, #0b1220, var(--bg));
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .topbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab {
            padding: 8px 14px;
            border-radius: 16px;
            cursor: pointer;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: .2s;
        }

        .tab:hover {
            transform: translateY(-2px);
            background: var(--panel2);
        }

        .tab.active {
            background: #238636;
            border-color: #2ea043;
        }

        .search input {
            font-size: 12px;
            padding: 12px;
            border: none;
            border-radius: 24px;
            background: var(--panel);
            color: white;
            width: 220px;
            outline: 1px solid var(--panel);
            transition: outline 0.2s;
        }
        .search input:hover {
            outline: 1px solid #2ea043;
        }
        .search input:focus {
            outline: 1px solid #2ea043;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-top: 20px;
            align-items: start;
        }

        .column {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 10px;
        }

        .column h2 {
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            font-size: 20px;
            margin: 0;
        }

        .player {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            margin: 6px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            transition: .2s;
        }

        .player:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.07);
        }

        .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .skin img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            image-rendering: pixelated;
            background: rgba(0, 0, 0, 0.2);
            outline: 1.5px solid #ffffff;
            display: block;
        }

        .name {
            font-size: 17px;
        }

        .tier-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            color: #9ca3af;
        }

        .global-player {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 12px 0;
            border-radius: 14px;
            background: var(--panel);
            cursor: pointer;
            transition: 0.2s;
        }

        .global-player:hover {
            transform: scale(1.03);
        }

        .global-player.rank-1 {
            box-shadow: 0 0 6px 1px gold;
            border: 1px solid gold;
            background: linear-gradient(112deg, rgba(255, 187, 0, 1) 0%, rgba(255, 187, 0, 1) 2%, rgba(4, 4, 54, 1) 26%);

        }

        .global-player.rank-2 {
            box-shadow: 0 0 6px 1px silver;
            border: 1px solid silver;
            background: linear-gradient(112deg, rgba(230, 230, 230, 1) 0%, rgba(230, 230, 230, 1) 2%, rgba(4, 4, 54, 1) 24%);

        }

        .global-player.rank-3 {
            box-shadow: 0 0 6px 1px #cd7f32;
            border: 1px solid #cd7f32;
            background: linear-gradient(112deg, rgba(205, 127, 50, 1) 0%, rgba(205, 127, 50, 1) 2%, rgba(4, 4, 54, 1) 26%);

        }

        .global-player.rank-1,
        .global-player.rank-2,
        .global-player.rank-3 {
            position: relative;
            overflow: hidden;

            --glint-speed: 1.8s;
            --glint-delay: 2.5s;
        }

        .global-player.rank-1 {
            box-shadow: 0 0 6px 1px gold;
            border: 1px solid gold;
        }

        .global-player.rank-2 {
            box-shadow: 0 0 6px 1px silver;
            border: 1px solid silver;
        }

        .global-player.rank-3 {
            box-shadow: 0 0 6px 1px #cd7f32;
            border: 1px solid #cd7f32;
        }

        /* GLINT LAYER (stable) */
        .global-player.rank-1::after,
        .global-player.rank-2::after,
        .global-player.rank-3::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;

            opacity: 0;

            background: linear-gradient(100deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0) 43%,
                    rgba(255, 255, 255, 0.1) 50%,
                    rgba(255, 255, 255, 0) 53%,
                    transparent 100%);

            background-size: 200% 100%;
        }

        /* hover triggers clean loop */
        .global-player.rank-1:after,
        .global-player.rank-2:after,
        .global-player.rank-3:after {
            opacity: 1;
            animation: glintSweep var(--glint-speed) ease infinite;
        }

        @keyframes glintSweep {
            0% {
                background-position: 185% 0;
            }

            100% {
                background-position: -20% 0;
            }
        }

        .unranked {
            text-align: center;
            color: #6b7280;
        }

        .divider {
            height: 1.5px;
            border-radius: 10px;
            width: 100%;
            margin: 0 0 15px;
            background: rgba(255, 255, 255, 0.1);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 999;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #0b1220;
            padding: 20px;
            border-radius: 20px;
            width: 350px;
            max-height: 80vh;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);

            transform: scale(0.95);
            transition: transform 0.2s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        #closeModal {
            float: right;
            cursor: pointer;
            font-size: 22px;
            position: absolute;
            color: #666666;
            transition: color 0.2s;
        }

        #closeModal:hover {
            color: #ffffff;
        }

        .profile-header {
            text-align: center;
        }

.skin-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    overflow: hidden;

    margin: 0 auto 10px auto;

    background: rgba(0,0,0,0.2);
    border: 2px solid rgba(255,255,255,0.2);

    position: relative;
}

.skin-circle img {
    position: absolute;

    /* make skin large so we can crop it */
    width: 180px;
    height: auto;

    image-rendering: pixelated;

    left: 50%;
    top: -60%;
    transform: translateX(-50%) scale(0.6);
}

        .profile-modes {
            margin-top: 15px;
        }

        .mode-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            margin: 5px 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .untested {
            color: #6b7280;
        }

        .tier-1 {
            color: #facc15;
        }

        .tier-2 {
            color: #c0c0c0;
        }

        .tier-3 {
            color: #cd7f32;
        }

        .tier-4 {
            color: var(--panel);
        }

        .tier-5 {
            color: var(--panel);
        }

        .points {
            font-size: 14px;
            color: #9ca3af;
            margin-left: auto;
        }
        .rank-number {
            font-size: 24px;
            color: #ffffff;
            width: 35px;
            text-align: left;
            opacity: 0.7;
        }
#profileRank svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: middle;
}
    </style>
</head>

<body>

    <div class="container">
        <h1>PvP Leaderboard</h1>

        <div class="topbar">
            <div class="tabs">
                <div class="tab active" data-mode="global">Overall</div>
                <div class="tab" data-mode="vanilla">Vanilla</div>
                <div class="tab" data-mode="uhc">UHC</div>
                <div class="tab" data-mode="pot">Pot</div>
                <div class="tab" data-mode="nethop">NethOP</div>
                <div class="tab" data-mode="smp">SMP</div>
                <div class="tab" data-mode="sword">Sword</div>
                <div class="tab" data-mode="axe">Axe</div>
                <div class="tab" data-mode="mace">Mace</div>
            </div>
            <div class="search"><input id="search" placeholder="Search player..."></div>
        </div>

        <div id="global"></div>
        <div class="grid" id="grid"></div>
    </div>
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span id="closeModal">&times;</span>
            <div class="profile-header">
                <div class="skin-circle">
                    <img id="profileSkin">
                </div>
                <h2 id="profileName"></h2>
            </div>
        <div id="profileModes" class="profile-modes"></div>
    </div>
    </div>
    <script>
<!-- TEMPORARY CODE -->

function generateData({
    count = 50,
    namePrefix = "Player",
    modes = ["vanilla","uhc","pot","smp","sword","axe","mace","nethop"],
    tiers = ["LT1","LT2","LT3","LT4","LT5"],
    htChance = 0.08,
    minModes = 8,
    maxModes = 8
} = {}) {

    const rand = arr => arr[Math.floor(Math.random() * arr.length)];
    const clamp = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    const data = [];

    for (let i = 1; i <= count; i++) {
        const player = { name: `${namePrefix}${i}` };

        const used = new Set();
        const modeCount = clamp(minModes, maxModes);

        while (used.size < modeCount) {
            used.add(rand(modes));
        }

        for (const m of used) {
            const isHT = Math.random() < htChance;
            const tier = rand(tiers);
            player[m] = isHT ? `HT${tier.slice(2)}` : tier;
        }

        data.push(player);
    }

    return data;
}
let data = generateData({
    count: 150,
    htChance: 0.4
});
data.push(
    {name: "CustomPlayer1",vanilla: "HT1",uhc: "HT1",pot: "HT1",nethop: "HT1",smp: "HT1",sword: "HT1",axe: "HT1",mace: "HT1",},

);
<!-- End -->
        const ranks = [
            { name: "Rookie", min: 0 },
            { name: "Novice", min: 10 },
            { name: "Silver", min: 50 },
            { name: "Gold", min: 150 },
            { name: "Diamond", min: 200 },
            { name: "Master", min: 250 },
            { name: "Grandmaster", min: 350 },
            { name: "Celestial", min: 400 }
        ];
        const modes = [
            "vanilla",
            "uhc",
            "pot",
            "nethop",
            "smp",
            "sword",
            "axe",
            "mace"
        ];
        const tierPoints = {
            HT1: 60,
            LT1: 45,
            HT2: 30,
            LT2: 20,
            HT3: 10,
            LT3: 6,
            HT4: 4,
            LT4: 3,
            HT5: 2,
            LT5: 1
        };
        let currentMode = "global";

        const grid = document.getElementById('grid');
        const global = document.getElementById('global');
        const search = document.getElementById('search');
        const tabs = document.querySelectorAll('.tab');

        function getHead(name) {
            return `https://mc-heads.net/avatar/${name}/64`;
        }

        function parse(t) {
            if (!t) return null;
            return {
                tier: +t.slice(2),
                high: t.startsWith('HT')
            };
        }

        function arrow(high) {
            return high ?
                `<svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/><path d="M6 20l6-6 6 6"/></svg>` :
                `<svg viewBox="0 0 24 24"><path d="M6 18l6-6 6 6"/></svg>`;
        }

function compute() {
    data.forEach(player => {
        let total = 0;
        let played = 0;

        modes.forEach(mode => {
            let tier = player[mode];
            if (!tier) return;

            let pts = tierPoints[tier] || 0;
            total += pts;
            played++;
        });

        player.total = total;
        player.avg = played ? (total / played) : 0;
        player.rank = getRank(player.total);
    });

    // ⭐ ADD THIS: assign fixed global rankings
    const sorted = [...data].sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        return b.avg - a.avg;
    });

    sorted.forEach((p, i) => {
        p.globalRank = i + 1;
    });
}

function getRank(points) {
    let current = ranks[0];

    for (const r of ranks) {
        if (points >= r.min) {
            current = r;
        } else {
            break;
        }
    }

    return current;
}
function getRankIcon(rankName) {
    switch(rankName) {
        case "Novice":
            return `<svg viewBox="0 0 24 24">
                <path d="M5 15 L12 9 L19 15"/>
            </svg>`;

        case "Silver":
            return `<svg viewBox="0 0 24 24">
                <path d="M5 17 L12 11 L19 17"/>
                <path d="M5 11 L12 5 L19 11"/>
            </svg>`;

        case "Gold":
            return `<svg viewBox="0 0 24 24">
                <path d="M5 19 L12 13 L19 19"/>
                <path d="M5 13 L12 7 L19 13"/>
                <path d="M5 7 L12 1 L19 7"/>
            </svg>`;

        case "Diamond":
            return `<svg viewBox="0 0 24 24">
                <polygon points="12,6 18,16 6,16"/>
            </svg>`;

        case "Master":
            return `<svg viewBox="0 0 24 24">
                <polygon points="12,3 20,11 12,19 4,11"/>
            </svg>`;
        case "Grandmaster":
            return `<svg viewBox="0 0 24 24">
                <polygon points="12,2 14.5,8 21,8 16,12 18,19 12,15 6,19 8,12 3,8 9.5,8"/>
            </svg>`;
        case "Celestial":
            return `<svg viewBox="0 0 24 24">
                <polygon points="12,3 19,15 5,15"/>
                <polygon points="12,19 5,7 19,7"/>
            </svg>`;
        default:
            return "";
    }
}
        /* ========================= */

function renderGlobal() {
    global.innerHTML = "";

    let q = search.value.toLowerCase(); // ← ADD THIS

    let sorted = [...data]
        .filter(p => p.name.toLowerCase().includes(q)) // ← ADD THIS
        .sort((a, b) => {
            if (b.total !== a.total) {
                return b.total - a.total;
            }
            return b.avg - a.avg;
        });

    sorted.forEach((p, i) => {
        let div = document.createElement('div');
        div.onclick = () => openProfile(p);
        div.className = 'global-player';

        if (p.globalRank === 1) div.classList.add("rank-1");
        if (p.globalRank === 2) div.classList.add("rank-2");
        if (p.globalRank === 3) div.classList.add("rank-3");

        let left = document.createElement('div');
        left.className = 'left';

        let rank = document.createElement('div');
        rank.className = 'rank-number';
        rank.textContent = `${p.globalRank}.`;

        let skinDiv = document.createElement('div');
        skinDiv.className = 'skin';

        let img = document.createElement('img');
        img.src = getHead(p.name);

        skinDiv.appendChild(img);

        let name = document.createElement('div');
        name.className = 'name';
        name.textContent = p.name;

        left.appendChild(rank);
        left.appendChild(skinDiv);
        left.appendChild(name);

        let icon = document.createElement('div');
        icon.className = 'tier-icon';
        icon.innerHTML = arrow(true);

        div.appendChild(left);

        let pts = document.createElement('div');
        pts.className = "points";
        pts.textContent = "(" + Math.round(p.total) + " Points)";

        div.appendChild(pts);
        div.appendChild(icon);

        global.appendChild(div);
    });

    // optional: show empty state
    if (!sorted.length) {
        global.innerHTML = `<div class="unranked">No players found</div>`;
    }
}

        /* ========================= */

        function renderGrid() {
            let q = search.value.toLowerCase();
            grid.innerHTML = "";

            // 🎨 Define colors per tier
            const tierColors = {
                1: "rgba(255, 215, 0, 0.15)", // gold
                2: "rgba(192, 192, 192, 0.15)", // silver
                3: "rgba(205, 127, 50, 0.15)", // bronze
                4: "var(--panel)",
                5: "var(--panel)"
            };

            for (let t = 1; t <= 5; t++) {
                let col = document.createElement('div');
                col.className = 'column';

                // 🎨 Apply custom color
                col.style.background = tierColors[t];
                col.style.border = `1px solid ${tierColors[t].replace("0.15","0.35")}`;

                let title = document.createElement('h2');
                title.textContent = "Tier " + t;
                col.appendChild(title);
                let divider = document.createElement('div');
                divider.className = 'divider';
                col.appendChild(divider);

                let players = data
                    .filter(p => p.name.toLowerCase().includes(q))
                    .filter(p => parse(p[currentMode])?.tier === t)
                    .sort((a, b) => {
                        const A = parse(a[currentMode]);
                        const B = parse(b[currentMode]);

                        if (!A && !B) return 0;
                        if (!A) return 1;
                        if (!B) return -1;

                        if (A.high && !B.high) return -1;
                        if (!A.high && B.high) return 1;

                        return A.tier - B.tier;
                    });

                players.forEach(p => {
                    let div = document.createElement('div');
                    div.onclick = () => openProfile(p);
                    div.className = 'player';

                    let left = document.createElement('div');
                    left.className = 'left';

                    let skinDiv = document.createElement('div');
                    skinDiv.className = 'skin';

                    let img = document.createElement('img');
                    img.src = getHead(p.name);

                    skinDiv.appendChild(img);

                    let name = document.createElement('div');
                    name.className = 'name';
                    name.textContent = p.name;

                    left.appendChild(skinDiv);
                    left.appendChild(name);

                    let icon = document.createElement('div');
                    icon.className = 'tier-icon';

                    let meta = parse(p[currentMode]);
                    icon.innerHTML = arrow(meta?.high);

                    div.appendChild(left);
                    div.appendChild(icon);

                    col.appendChild(div);
                });

                if (!players.length) {
                    let e = document.createElement('div');
                    e.className = 'unranked';
                    e.textContent = '—';
                    col.appendChild(e);
                }

                grid.appendChild(col);
            }
        }

        /* ========================= */

        function renderAll() {
            compute();

            if (currentMode === 'global') {
                renderGlobal();
                grid.innerHTML = "";
            } else {
                global.innerHTML = "";
                renderGrid();
            }
        }

        search.addEventListener('input', renderAll);

        tabs.forEach(t => t.onclick = () => {
            tabs.forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            currentMode = t.dataset.mode;
            renderAll();
        });

        renderAll();
        const modal = document.getElementById('profileModal');
        const profileName = document.getElementById('profileName');
        const profileSkin = document.getElementById('profileSkin');
        const profileModes = document.getElementById('profileModes');
        const closeModal = document.getElementById('closeModal');

        function openProfile(player) {
            profileName.textContent = player.name;
            profileSkin.src = `https://mc-heads.net/body/${player.name}`;
        const oldRank = document.getElementById("profileRank");
        if (oldRank) oldRank.remove();
        
        const rankDiv = document.createElement("div");
        rankDiv.id = "profileRank";
        rankDiv.textContent = player.rank.name;
        rankDiv.innerHTML = `
            ${getRankIcon(player.rank.name)}
            <span style="margin-left:6px;">${player.rank.name}</span>
        `;
        
        rankDiv.style.marginTop = "6px";
        rankDiv.style.fontSize = "14px";
        rankDiv.style.color = "#9ca3af";
        rankDiv.style.fontWeight = "600";
        
        document.querySelector(".profile-header").appendChild(rankDiv);
        
        
            profileModes.innerHTML = "";

            modes.forEach(mode => {
                let row = document.createElement('div');
                row.className = 'mode-row';

                let label = document.createElement('div');
                label.textContent = mode.toUpperCase();

                let value = document.createElement('div');

                let tier = player[mode];

                if (!tier) {
                    value.textContent = "Untested";
                    value.className = "untested";
                } else {
                    let meta = parse(tier);

                    value.textContent = tier;

                    // add tier color
                    value.classList.add(`tier-${meta.tier}`);

                    // high vs low styling
                    if (meta.high) {
                        value.classList.add("tier-high");
                    } else {
                        value.classList.add("tier-low");
                    }
                }

                row.appendChild(label);
                row.appendChild(value);

                profileModes.appendChild(row);
            });

            modal.classList.add("show");;
        }

        function closeProfile() {
            modal.classList.remove("show");
        }

        closeModal.onclick = closeProfile;

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeProfile();
            }
        });
    </script>

</body>

</html>
